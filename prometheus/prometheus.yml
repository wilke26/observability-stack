global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    stack: observability-stack

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: promtail
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: 'isd'
    static_configs:
      - targets: ['host.docker.internal:80']
    metrics_path: '/metrics'

  # Ist der Compose-Profil-Dienst "otel" deaktiviert, erscheint dieses Target
  # erwartungsgemäß als DOWN. Aktivieren: docker compose --profile otel up -d
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
